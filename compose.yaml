services:
  db:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "6432:5432"
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=shareit
      - POSTGRES_PASSWORD=shareit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d shareit -U shareit"]
      timeout: 5s
      interval: 5s
      retries: 10